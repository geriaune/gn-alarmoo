# gn-alarmoo v1 hardware module — Wi-Fi only, no VPN/Tailscale support.
# For the v2 module (Wi-Fi + Tailscale VPN) use paradox-sp7000+.yaml instead.
# Confirmed working on these firmware versions:
# - Paradox SP7000+ Firmware: 
esphome:
  name: paradox
  friendly_name: paradox

# The v1 module has no RGB status LED, so there is nothing to signal state
# with — the red LED on the board is a plain power indicator, wired to the
# supply rather than to the ESP.

esp32:
  board: esp32-s3-devkitc-1   # ESP32-S3 module; for an ESP32-C3 module set the matching board, e.g. esp32-c3-devkitm-1
  framework:
    type: esp-idf

# No PSRAM needed: it was only a requirement for the VPN stack, which the v1
# module does not run. That is why the v1 firmware also fits an ESP32-C3.

# Component implementations sourced from this repository and ref
external_components:
  - source:
      type: git
      url: https://github.com/geriaune/gn-alarmoo
      ref: main
    components: [stream_server]
    refresh: 0s

logger:
  level: INFO   # change to DEBUG for more informative logs
  hardware_uart: UART0
  baud_rate: 115200   # do not change this for PC log output to work

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key   # generated by ESPHome while adding a device — set it in ESPHome App SECRETS
#  reboot_timeout: 0s   # uncomment if you don't use the Home Assistant API and want to avoid ESP rebooting when it can't connect to HA

ota:
  - platform: esphome
    password: "xxxxxxxxxxxxxxxxxxxxx" # generated by ESPHome while adding a device

wifi:
  ssid: !secret wifi_ssid           # change this to your wifi SSID or use fallback AP for wifi settings
  password: !secret wifi_password   # change this to your wifi password or use fallback AP for wifi settings
#  use_address: "192.168.x.y"      # set this to the module's LAN IP if mDNS discovery doesn't work on your network

#  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Paradox Fallback Hotspot"
    password: "xxxxxxxxxxxxxxxxxxxxx" # random password for fallback AP

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

uart:
  - id: paradox_uart
    tx_pin: 19    # S3 pinout of the geriaune.pro built module — change for a different board (an ESP32-C3 has a different pinout) or different wiring
    rx_pin: 20    # S3 pinout of the geriaune.pro built module — change for a different board (an ESP32-C3 has a different pinout) or different wiring
    baud_rate: 115200

stream_server:
  uart_id: paradox_uart
  port: 10000

binary_sensor:
  - platform: stream_server
    connected:
      name: "Paradox UART"

sensor:
  - platform: stream_server
    connection_count:
      name: "Number of UART connections"

    # WiFi Signal sensor.
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    id: uptime_seconds
    internal: true
    update_interval: 60s

  - platform: template
    name: "Last Restart"
    device_class: timestamp
    entity_category: diagnostic
    lambda: |-
      static float boot_timestamp = 0.0f;

      if (boot_timestamp == 0.0f) {
        auto now = id(homeassistant_time).now();
        if (now.is_valid()) {
          boot_timestamp = now.timestamp - id(uptime_seconds).state;
        }
      }

      return boot_timestamp;
