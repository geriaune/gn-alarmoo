name: Validate ESPHome config

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'vendor/**'
      - 'microlink/**'
      - 'paradox-*.yaml'
      # changes to this workflow must retrigger it, otherwise a CI fix sits
      # unverified until some other path happens to change
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'vendor/**'
      - 'microlink/**'
      - 'paradox-*.yaml'
      # changes to this workflow must retrigger it, otherwise a CI fix sits
      # unverified until some other path happens to change
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      # schema checks are cheap — report every config, don't stop at the first
      fail-fast: false
      matrix:
        config: [paradox-sp6000.yaml, paradox-sp7000.yaml, 'paradox-sp7000+.yaml',
                 paradox-sp6000-v1.yaml, paradox-sp7000-v1.yaml, 'paradox-sp7000+-v1.yaml']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml << 'EOF'
          tailscale_auth_key: "tskey-auth-dummy-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
          wifi_ssid: "DummySSID"
          wifi_password: "DummyPassword"
          # CI-only throwaway key; must be valid base64 of 32 bytes or the api: schema rejects it
          api_encryption_key: "YlZzoA+vKh9XiLmr+8rDq9tP0u0+HEwG4Ko0Pncy62A="
          EOF

      - name: Validate ${{ matrix.config }}
        run: esphome config "${{ matrix.config }}"

      - name: Validate package YAML
        run: |
          # Create a minimal test config that uses the package
          cat > /tmp/test-package.yaml << 'EOF'
          esphome:
            name: test-validate
          esp32:
            board: esp32-s3-devkitc-1
            framework:
              type: esp-idf
          psram:
            mode: octal
            speed: 80MHz
          packages:
            tailscale:
              url: https://github.com/${{ github.repository }}
              ref: ${{ github.sha }}
              files: [vendor/esphome-tailscale/packages/tailscale/tailscale.yaml]
          # The package only declares tailscale platforms — the component itself
          # has to come from external_components, same as the paradox-*.yaml do.
          external_components:
            - source:
                type: git
                url: https://github.com/${{ github.repository }}
                ref: ${{ github.sha }}
              components: [tailscale]
          tailscale:
            auth_key: "tskey-auth-dummy-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
          wifi:
            ssid: "DummySSID"
            password: "DummyPassword"
          logger:
          api:
          EOF
          esphome config /tmp/test-package.yaml

  compile:
    runs-on: ubuntu-latest
    # esphome compile pulls the ESP-IDF toolchain and builds the full
    # firmware including the vendored microlink component. Schema-level
    # issues are caught in `validate` above — this job is the net that
    # catches C++ breakage, missing includes, or a microlink API drift
    # before it lands on main and reaches users via packages: ref: main.
    strategy:
      matrix:
        config: [paradox-sp6000.yaml, paradox-sp7000.yaml, 'paradox-sp7000+.yaml',
                 paradox-sp6000-v1.yaml, paradox-sp7000-v1.yaml, 'paradox-sp7000+-v1.yaml']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome

      - name: Cache ESPHome build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .esphome
          key: esphome-compile-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('components/tailscale/__init__.py', 'microlink/components/microlink/CMakeLists.txt') }}
          restore-keys: |
            esphome-compile-${{ runner.os }}-${{ matrix.config }}-

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml << 'EOF'
          tailscale_auth_key: "tskey-auth-dummy-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
          wifi_ssid: "DummySSID"
          wifi_password: "DummyPassword"
          # CI-only throwaway key; must be valid base64 of 32 bytes or the api: schema rejects it
          api_encryption_key: "YlZzoA+vKh9XiLmr+8rDq9tP0u0+HEwG4Ko0Pncy62A="
          EOF

      - name: Compile ${{ matrix.config }}
        run: esphome compile "${{ matrix.config }}"
