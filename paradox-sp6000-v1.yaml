# gn-alarmoo v1 hardware module — Wi-Fi only, no VPN/Tailscale support.
# For the v2 module (Wi-Fi + Tailscale VPN) use paradox-sp6000.yaml instead.
# Confirmed working on these firmware versions:
# - Paradox SP6000  Firmware: 4.94 build 0 
esphome:
  name: paradox
  friendly_name: paradox
  on_boot:
    priority: 600             # runs before wifi init
    then:
      - light.turn_on:
          id: rgb_light
          red: 100%
          green: 0%
          blue: 0%
          brightness: 40%
          effect: blink

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# The v1 module is Wi-Fi only and does not need PSRAM (that was a VPN
# requirement). Uncomment this block only if your board actually has PSRAM —
# enabling it on a board without PSRAM fails at boot.
#psram:
#  mode: octal
#  speed: 80MHz

# Component implementations sourced from this repository and ref
external_components:
  - source:
      type: git
      url: https://github.com/geriaune/gn-alarmoo
      ref: main
    components: [stream_server]
    refresh: 0s

logger:
  level: INFO   # change to DEBUG for more informative logs
  hardware_uart: UART0
  baud_rate: 115200   # do not change this for PC log output to work

# Enable Home Assistant API
api:
  encryption:
    key: "xxxxxxxxxxxxxxxxxxxxx" # generated by ESPHome while adding a device
#  reboot_timeout: 0s   # uncomment if you don't use the Home Assistant API and want to avoid ESP rebooting when it can't connect to HA

ota:
  - platform: esphome
    password: "xxxxxxxxxxxxxxxxxxxxx" # generated by ESPHome while adding a device

wifi:
  ssid: !secret wifi_ssid           # change this to your wifi SSID or use fallback AP for wifi settings
  password: !secret wifi_password   # change this to your wifi password or use fallback AP for wifi settings
#  use_address: "192.168.x.y"      # set this to the module's LAN IP if mDNS discovery doesn't work on your network
  on_connect:
    - script.execute: update_light_state
  on_disconnect:
    - script.execute: update_light_state

#  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Paradox Fallback Hotspot"
    password: "xxxxxxxxxxxxxxxxxxxxx" # random password for fallback AP

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

uart:
  - id: paradox_uart
    tx_pin: 19    # change this if you are using anything other than geriaune.pro built module and using a different GPIO for TX
    rx_pin: 20    # change this if you are using anything other than geriaune.pro built module and using a different GPIO for RX
    baud_rate: 9600

stream_server:
  uart_id: paradox_uart
  port: 10000

binary_sensor:
  - platform: stream_server
    connected:
      name: "Paradox UART"

# Script to handle the two-state logic
script:
  - id: update_light_state
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            # GREEN: WiFi connected
            - light.turn_on:
                id: rgb_light
                red: 0%
                green: 100%
                blue: 0%
                brightness: 40%
                effect: none
            - logger.log: "State: WiFi connected (Green)"
          else:
            # No WiFi connection - YELLOW
            - light.turn_on:
                id: rgb_light
                red: 100%
                green: 100%
                blue: 0%
                brightness: 40%
                effect: blink
            - logger.log: "State: No WiFi (Yellow)"

# Periodic check as backup
interval:
  - interval: 30s
    then:
      - script.execute: update_light_state

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    name: "Status Light"
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "blink"
          transition_length: 100ms
          update_interval: 500ms
          min_brightness: 0%
          max_brightness: 100%

sensor:
  - platform: stream_server
    connection_count:
      name: "Number of UART connections"

    # WiFi Signal sensor.
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    id: uptime_seconds
    internal: true
    update_interval: 60s

  - platform: template
    name: "Last Restart"
    device_class: timestamp
    entity_category: diagnostic
    lambda: |-
      static float boot_timestamp = 0.0f;

      if (boot_timestamp == 0.0f) {
        auto now = id(homeassistant_time).now();
        if (now.is_valid()) {
          boot_timestamp = now.timestamp - id(uptime_seconds).state;
        }
      }

      return boot_timestamp;
