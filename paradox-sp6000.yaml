# Confirmed working on these firmware versions:
# - Paradox SP6000  Firmware: 4.94 build 0 
esphome:
  name: paradox
  friendly_name: paradox
  on_boot:
    priority: 600             # runs before wifi init
    then:
      - light.turn_on:
          id: rgb_light
          red: 100%
          green: 0%
          blue: 0%
          brightness: 40%
          effect: blink

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

packages:
  tailscale:
    url: https://github.com/geriaune/gn-alarmoo
    ref: dev
    files: [vendor/esphome-tailscale/packages/tailscale/tailscale.yaml]
    refresh: 0s

# Component implementations sourced from the same repository and ref
external_components:
  - source:
      type: git
      url: https://github.com/geriaune/gn-alarmoo
      ref: dev
    components: [stream_server, tailscale]
    refresh: 0s

tailscale:
  auth_key: !secret tailscale_auth_key  # set this in ESPHome App SECRETS, generate it in tailscale/headscale server
  hostname: "paradox"
  disable_telemetry: true
#  uncomment below config line for headscale self-hosted server, not required for tailscale setup
#  login_server: "http://vpn.yourhost.com:8080"

logger:
  hardware_uart: UART0
  baud_rate: 115200

# Enable Home Assistant API
api:
  encryption:
    key: "xxxxxxxxxxxxxxxxxxxxx" # generated by ESPHome while adding a device
#  reboot_timeout: 0s   # uncomment if you don't use the Home Assistant API and want to avoid ESP rebooting when it can't connect to HA

ota:
  - platform: esphome
    password: "xxxxxxxxxxxxxxxxxxxxx" # generated by ESPHome while adding a device

wifi:
  ssid: !secret wifi_ssid           # change this to your wifi SSID or use fallback AP for wifi settings
  password: !secret wifi_password   # change this to your wifi password or use fallback AP for wifi settings
#  use_address: "100.x.y.z"        # set this AFTER you flash the ESP and connect to the VPN
  on_connect:
    - script.execute: update_light_state
  on_disconnect:
    - script.execute: update_light_state

#  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Paradox Fallback Hotspot"
    password: "xxxxxxxxxxxxxxxxxxxxx" # random password for fallback AP

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

uart:
  - id: paradox_uart
    tx_pin: 19    # change this if you are using anything other than geriaune.pro built module and using a different GPIO for TX
    rx_pin: 20    # change this if you are using anything other than geriaune.pro built module and using a different GPIO for RX
    baud_rate: 9600

stream_server:
  uart_id: paradox_uart
  port: 10000

binary_sensor:
  - platform: stream_server
    connected:
      name: "Paradox UART"

# Mirror sensor to trigger automations when tailscale state changes
  - platform: template
    id: tailscale_state_mirror
    lambda: |-
      return id(tailscale_connected).state;
    on_state:
      - script.execute: update_light_state

# Script to handle the three-state logic
script:
  - id: update_light_state
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - if:
                condition:
                  binary_sensor.is_on: tailscale_connected
                then:
                  # GREEN: WiFi + VPN connected
                  - light.turn_on:
                      id: rgb_light
                      red: 0%
                      green: 100%
                      blue: 0%
                      brightness: 40%
                      effect: none
                  - logger.log: "State: WiFi + VPN (Green)"
                else:
                  # BLUE: WiFi connected, VPN not connected
                  - light.turn_on:
                      id: rgb_light
                      red: 0%
                      green: 0%
                      blue: 100%
                      brightness: 40%
                      effect: none
                  - logger.log: "State: WiFi only (Blue)"
          else:
            # No WiFi connection - YELLOW
            - light.turn_on:
                id: rgb_light
                red: 100%
                green: 100%
                blue: 0%
                brightness: 40%
                effect: blink
            - logger.log: "State: No WiFi (Yellow)"

# Periodic check as backup
interval:
  - interval: 30s
    then:
      - script.execute: update_light_state

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light  
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    name: "Status Light"
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "blink"
          transition_length: 100ms
          update_interval: 500ms
          min_brightness: 0%
          max_brightness: 100%

sensor:
  - platform: stream_server
    connection_count:
      name: "Number of UART connections"

    # WiFi Signal sensor.
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    id: uptime_seconds
    internal: true
    update_interval: 60s

  - platform: template
    name: "Last Restart"
    device_class: timestamp
    entity_category: diagnostic
    lambda: |-
      static float boot_timestamp = 0.0f;
      
      if (boot_timestamp == 0.0f) {
        auto now = id(homeassistant_time).now();
        if (now.is_valid()) {
          boot_timestamp = now.timestamp - id(uptime_seconds).state;
        }
      }
      
      return boot_timestamp;
